name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web panel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Typecheck
        working-directory: web
        run: npm run typecheck
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Build
        working-directory: web
        run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  go:
    name: Go build and test
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      - name: Verify modules
        run: go mod verify
      - name: Check formatting
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l cmd internal web/embed.go docs/embed.go)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./internal/...
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -o bin/backvault ./cmd/backvault

  scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Parse every script
        run: |
          set -euo pipefail
          status=0
          for file in scripts/*.sh scripts/lib/*.sh deploy/install.sh; do
            bash -n "$file" || status=1
          done
          exit $status
      - name: Reject comments outside the shebang
        run: |
          set -euo pipefail
          status=0
          for file in scripts/*.sh scripts/lib/*.sh deploy/install.sh; do
            if awk 'NR > 1 && /^[[:space:]]*#/ { print FILENAME ":" FNR ": " $0; found = 1 } END { exit !found }' "$file"; then
              status=1
            fi
          done
          exit $status
      - name: Check the systemd unit
        run: systemd-analyze verify deploy/systemd/backvault.service || true

  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: backvault:ci
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
      - name: Report the tools the image ships
        run: docker run --rm backvault:ci check
